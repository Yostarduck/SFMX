[Window]
Width=1280
Height=720
Title=SFMX Engine
VSync=true

; Debug-only dev flags. Ignored in Release builds (the code that reads them is
; compiled out via SFMX_DEBUG_MODE), so leaving them here is harmless when shipping.
[Debug]
; Load Lua scripts from their raw source .lua (hot-reloadable with F5) instead of the
; cooked .sfmxasset chunk. Needs the content root to point at editable sources
; (e.g. run with `--content-dir Game`); otherwise it falls back to the cooked chunk.
RawScripts=true
; Content-root-relative dir the raw script sources live under.
RawSourceDir=resources
